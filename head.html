<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
  move-to-http-header="true"
>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#17181a"/>
<meta property="og:type" content="website"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="alternate icon" type="image/jpeg" href="/oak-chain-logo.jpeg"/>
<link rel="apple-touch-icon" href="/oak-chain-logo.jpeg"/>
<script nonce="aem">
  (() => {
    const path = window.location.pathname.replace(/\/$/, '') || '/';
    const landing = document.querySelector('meta[name="template"]')?.content === 'landing';
    if (!landing && !['/', '/index', '/nav', '/footer'].includes(path)) {
      document.documentElement.classList.add('docs-page');
    }
  })();
</script>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<link rel="preload" href="/fonts/IBMPlexSansCondensed-SemiBold-Latin1.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="/fonts/IBMPlexSans-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="/styles/fonts.css"/>
<link rel="stylesheet" href="/styles/styles.css"/>
